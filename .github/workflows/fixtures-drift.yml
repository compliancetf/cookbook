name: fixtures-drift

# Re-capture the public-route fixtures and fail if the registry now serves
# something different from what is committed. Calls are spaced out to stay under
# the preview route's rate limit, so this takes a couple of minutes.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-capture and compare
        run: |
          status=0
          for s in preview-module-changes prevent-destroy-in-module; do
            tmp=$(mktemp -d)
            EXPECTED=$tmp "recipes/$s/capture.sh"
            for f in $(cd "$tmp" && find . -name '*.json'); do
              diff -u "recipes/$s/expected/$f" "$tmp/$f" || status=1
            done
          done
          if [ "$status" -ne 0 ]; then
            echo "The registry now serves something different. Run 'make fixtures-public', review, commit."
          fi
          exit $status
